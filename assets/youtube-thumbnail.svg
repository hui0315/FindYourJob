<svg width="1280" height="720" viewBox="0 0 1280 720"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 右側青色聚光 -->
    <radialGradient id="solutionGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- 左上紅色光暈（痛點） -->
    <radialGradient id="painGlow" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 文字重陰影 -->
    <filter id="heavyTextShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <!-- 表格浮出陰影 -->
    <filter id="floatShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <!-- 青色霓虹發光 -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- 箭頭發光（收斂，不搶表格風頭） -->
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#facc15" flood-opacity="0.35"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 散亂瀏覽器視窗模板 -->
    <g id="dark-browser">
      <rect width="280" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 30 L 0 30 Z" fill="#0f172a"/>
      <circle cx="16" cy="15" r="5" fill="#ef4444" fill-opacity="0.5"/>
      <circle cx="32" cy="15" r="5" fill="#facc15" fill-opacity="0.5"/>
      <circle cx="48" cy="15" r="5" fill="#22c55e" fill-opacity="0.5"/>
      <rect x="20" y="50" width="150" height="12" rx="4" fill="#334155"/>
      <rect x="20" y="80" width="240" height="12" rx="4" fill="#334155"/>
      <rect x="20" y="110" width="200" height="12" rx="4" fill="#334155"/>
    </g>
  </defs>

  <!-- ==================== 背景層 ==================== -->
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#painGlow)"/>
  <rect width="1280" height="720" fill="url(#solutionGlow)"/>

  <!-- 背景網格（科技感） -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- ==================== 左半部：巨大文字 ==================== -->
  <g transform="translate(40, -10)"
     font-family="'Noto Sans TC', Inter, -apple-system, sans-serif"
     font-weight="900" filter="url(#heavyTextShadow)">

    <!-- 引導標題 -->
    <text x="15" y="110" font-size="46" fill="#94a3b8" letter-spacing="2">找工作開了...</text>

    <!-- 第一行：30 巨大化 + 個分頁？ -->
    <text x="0" y="340">
      <tspan font-size="240" fill="#facc15">30</tspan>
      <tspan font-size="85" fill="#f8fafc" dy="-35"> 個分頁？</tspan>
    </text>

    <!-- 第二行：一張表（青色）搞定（白色） -->
    <text x="10" y="520">
      <tspan font-size="115" fill="#38bdf8">一張表</tspan>
      <tspan font-size="115" fill="#f8fafc">搞定</tspan>
    </text>
  </g>

  <!-- ==================== 右上：散亂分頁（往左下移，增加與箭頭重疊感） ==================== -->
  <g transform="translate(820, 60)" opacity="0.85" filter="url(#heavyTextShadow)">
    <use href="#dark-browser" x="0" y="0" transform="scale(0.8) rotate(-15, 140, 90)"/>
    <use href="#dark-browser" x="80" y="-30" transform="scale(0.8) rotate(10, 140, 90)"/>
    <use href="#dark-browser" x="40" y="60" transform="scale(0.8) rotate(-5, 140, 90)"/>
    <use href="#dark-browser" x="150" y="40" transform="scale(0.8) rotate(18, 140, 90)"/>

    <!-- 紅色 ✗ 徽章（移到左側，更清晰的對比） -->
    <g transform="translate(-20, 20)">
      <circle cx="35" cy="35" r="30" fill="#ef4444"/>
      <path d="M 22 22 L 48 48 M 48 22 L 22 48"
            stroke="white" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== 垂直箭頭（散亂→表格，收斂不搶戲） ==================== -->
  <g transform="translate(980, 240) rotate(90)" filter="url(#arrowGlow)">
    <path d="M 0 0 L 60 0" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
    <path d="M 35 -18 L 72 0 L 35 18" stroke="#facc15" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ==================== 右下：霓虹發光表格 ==================== -->
  <g transform="translate(760, 360)" filter="url(#floatShadow)">
    <!-- 外框（雙層：霓虹 + 細邊） -->
    <rect width="480" height="320" rx="20" fill="#1e293b"
          stroke="#38bdf8" stroke-width="4" filter="url(#neonGlow)"/>
    <rect width="480" height="320" rx="20" fill="#0f172a"
          stroke="white" stroke-opacity="0.5" stroke-width="1"/>

    <!-- 表頭列 -->
    <path d="M 0 20 Q 0 0 20 0 L 460 0 Q 480 0 480 20 L 480 60 L 0 60 Z" fill="#1e293b"/>
    <line x1="0" y1="60" x2="480" y2="60" stroke="#334155" stroke-width="2"/>

    <!-- 表頭內容 -->
    <circle cx="30" cy="30" r="8" fill="#38bdf8"/>
    <rect x="55" y="24" width="80" height="12" rx="6" fill="#f8fafc"/>
    <rect x="180" y="24" width="60" height="12" rx="6" fill="#94a3b8"/>
    <rect x="300" y="24" width="90" height="12" rx="6" fill="#94a3b8"/>

    <!-- 資料列 -->
    <g transform="translate(0, 60)">
      <!-- Row 1（淺底） -->
      <rect x="0" y="0" width="480" height="50" fill="#f8fafc" fill-opacity="0.05"/>
      <rect x="30" y="18" width="100" height="14" rx="7" fill="#38bdf8"/>
      <rect x="180" y="18" width="80" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="300" y="18" width="120" height="14" rx="7" fill="#cbd5e1"/>
      <!-- Row 2 -->
      <rect x="30" y="68" width="70" height="14" rx="7" fill="#38bdf8"/>
      <rect x="180" y="68" width="90" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="300" y="68" width="100" height="14" rx="7" fill="#cbd5e1"/>
      <!-- Row 3（淺底） -->
      <rect x="0" y="100" width="480" height="50" fill="#f8fafc" fill-opacity="0.05"/>
      <rect x="30" y="118" width="120" height="14" rx="7" fill="#38bdf8"/>
      <rect x="180" y="118" width="60" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="300" y="118" width="140" height="14" rx="7" fill="#cbd5e1"/>
      <!-- Row 4 -->
      <rect x="30" y="168" width="90" height="14" rx="7" fill="#38bdf8"/>
      <rect x="180" y="168" width="110" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="300" y="168" width="80" height="14" rx="7" fill="#cbd5e1"/>
      <!-- Row 5（淺底） -->
      <rect x="0" y="200" width="480" height="50" fill="#f8fafc" fill-opacity="0.05"/>
      <rect x="30" y="218" width="80" height="14" rx="7" fill="#38bdf8"/>
      <rect x="180" y="218" width="100" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="300" y="218" width="90" height="14" rx="7" fill="#cbd5e1"/>
    </g>

    <!-- 垂直分隔線 -->
    <line x1="160" y1="60" x2="160" y2="320" stroke="#334155" stroke-width="2"/>
    <line x1="280" y1="60" x2="280" y2="320" stroke="#334155" stroke-width="2"/>

    <!-- 綠色 ✓ 徽章 -->
    <g transform="translate(420, -30)" filter="url(#heavyTextShadow)">
      <circle cx="45" cy="45" r="40" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
      <path d="M 26 46 L 40 60 L 64 32"
            stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- ==================== Logo 浮水印（左下角，深色背景適配亮度） ==================== -->
  <g transform="translate(50, 648)">
    <!-- 羅盤圖示（靛藍 #4f46e5） -->
    <g transform="scale(1.1)">
      <rect width="32" height="32" rx="8" fill="#4f46e5"/>
      <circle cx="16" cy="16" r="7" stroke="white" stroke-width="2" fill="none"/>
      <circle cx="16" cy="16" r="2.5" fill="white"/>
      <line x1="16" y1="6" x2="16" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="21" x2="16" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="16" x2="11" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="21" y1="16" x2="26" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 文字商標（深色背景適配：Find 淺灰 + YourJob 亮靛藍） -->
    <text x="42" y="26"
          font-family="Inter, -apple-system, sans-serif"
          font-size="20" font-weight="500"
          fill="#94a3b8">Find</text>
    <text x="80" y="26"
          font-family="Inter, -apple-system, sans-serif"
          font-size="20" font-weight="700"
          fill="#818cf8">YourJob</text>
  </g>

</svg>
